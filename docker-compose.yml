version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skywork-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=SkyWork_secure_jwt_token_secret_key_2026
      - ADMIN_USER=admin
      - ADMIN_PASS=123456
      - APP_URL=https://skywork.us.cc
    volumes:
      - ./backend/data:/app/data
      - ./backend/public/uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Web static frontend (can be served via Nginx or panel static site)
  web:
    image: nginx:alpine
    container_name: skywork-web
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html/web:ro
      - ./admin:/usr/share/nginx/html/admin:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
